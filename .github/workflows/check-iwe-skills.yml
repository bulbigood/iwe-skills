name: Check IWE skills

on:
  pull_request:
    paths:
      - "config.toml"
      - "contracts/**"
      - "docs/**"
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/check-iwe-skills.yml"
  push:
    branches: [main]
    paths:
      - "config.toml"
      - "contracts/**"
      - "docs/**"
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/check-iwe-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    outputs:
      manifest: ${{ steps.skills.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
      - id: skills
        run: echo "manifest=$(python3 scripts/skill_manifest.py --json)" >> "$GITHUB_OUTPUT"

  skill:
    needs: manifest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.manifest.outputs.manifest).skills }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/eval/requirements.txt
      - name: Install eval validation dependencies
        run: python3 -m pip install --requirement tests/eval/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.runtime.source == 'cargo'
      - name: Install configured IWE CLI with Cargo
        if: matrix.runtime.source == 'cargo'
        run: cargo install iwe --version "${{ matrix.runtime.tested }}" --locked
      - name: Install configured IWE CLI from GitHub release
        if: matrix.runtime.source == 'homebrew'
        env:
          IWE_SHA256: a77e1008a47e49d4d1b996c5b58bfe3448c0044e07ccecd9e8d998cbcd06567c
        run: |
          archive="$RUNNER_TEMP/iwe.tar.gz"
          runtime="$RUNNER_TEMP/iwe-runtime"
          version="${{ matrix.runtime.tested }}"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/iwe-org/iwe/releases/download/iwe-v${version}/iwe-v${version}-universal-apple-darwin.tar.gz" \
            --output "$archive"
          echo "$IWE_SHA256  $archive" | shasum --algorithm 256 --check
          mkdir -p "$runtime"
          tar -xzf "$archive" -C "$runtime" iwe
          install -m 0755 "$runtime/iwe" "$(brew --prefix)/bin/iwe"
      - name: Require configured directory runtime
        if: matrix.runtime.source == 'directory'
        run: test -x "${{ matrix.runtime.directory }}/${{ matrix.runtime.cli }}"
      - name: Verify frozen contract
        run: python3 scripts/sync_iwe_contract.py --skill "${{ matrix.name }}" --check
      - name: Run deterministic tests
        env:
          IWE_SKILL: ${{ matrix.name }}
        run: python3 -m unittest discover -s tests -v
      - name: Report installed payload metrics
        run: python3 scripts/skill_metrics.py
      - name: Verify eval scenarios load without agents
        run: python3 tests/eval/run.py --skill "${{ matrix.name }}" --list

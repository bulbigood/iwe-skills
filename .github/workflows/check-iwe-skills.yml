name: Check IWE skill

on:
  pull_request:
    paths:
      - "config.toml"
      - "contracts/iwe-v18.json"
      - "scripts/skill_manifest.py"
      - "scripts/sync_iwe_contract.py"
      - "skills/iwe-v18/**"
      - ".github/workflows/check-iwe-skills.yml"
  push:
    branches: [main]
    paths:
      - "config.toml"
      - "contracts/iwe-v18.json"
      - "scripts/skill_manifest.py"
      - "scripts/sync_iwe_contract.py"
      - "skills/iwe-v18/**"
      - ".github/workflows/check-iwe-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate skill manifest
        run: python3 scripts/skill_manifest.py --json
      - name: Install IWE 0.18.0
        env:
          IWE_SHA256: a77e1008a47e49d4d1b996c5b58bfe3448c0044e07ccecd9e8d998cbcd06567c
        run: |
          archive="$RUNNER_TEMP/iwe.tar.gz"
          runtime="$RUNNER_TEMP/iwe-runtime"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/iwe-org/iwe/releases/download/iwe-v0.18.0/iwe-v0.18.0-universal-apple-darwin.tar.gz" \
            --output "$archive"
          echo "$IWE_SHA256  $archive" | shasum --algorithm 256 --check
          mkdir -p "$runtime"
          tar -xzf "$archive" -C "$runtime" iwe
          install -m 0755 "$runtime/iwe" "$(brew --prefix)/bin/iwe"
      - name: Verify frozen contract
        run: python3 scripts/sync_iwe_contract.py --skill iwe-v18 --check

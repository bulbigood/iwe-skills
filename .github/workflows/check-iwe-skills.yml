name: Check IWE skills

on:
  pull_request:
    paths:
      - "config.toml"
      - "contracts/**"
      - "docs/**"
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/check-iwe-skills.yml"
  push:
    branches: [main]
    paths:
      - "config.toml"
      - "contracts/**"
      - "docs/**"
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/check-iwe-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    outputs:
      manifest: ${{ steps.skills.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4
      - id: skills
        run: echo "manifest=$(python3 scripts/skill_manifest.py --json)" >> "$GITHUB_OUTPUT"

  skill:
    needs: manifest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.manifest.outputs.manifest).skills }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.runtime.source == 'cargo'
      - name: Install configured IWE CLI with Cargo
        if: matrix.runtime.source == 'cargo'
        run: cargo install iwe --version "${{ matrix.runtime.tested }}" --locked
      - name: Install configured IWE CLI with Homebrew
        if: matrix.runtime.source == 'homebrew'
        run: brew install iwe
      - name: Require configured directory runtime
        if: matrix.runtime.source == 'directory'
        run: test -x "${{ matrix.runtime.directory }}/${{ matrix.runtime.cli }}"
      - name: Verify frozen contract
        run: python3 scripts/sync_iwe_contract.py --skill "${{ matrix.name }}" --check
      - name: Run deterministic tests
        env:
          IWE_SKILL: ${{ matrix.name }}
        run: python3 -m unittest discover -s tests -v
      - name: Report installed payload metrics
        run: python3 scripts/skill_metrics.py
      - name: Verify eval scenarios load without agents
        run: python3 tests/eval/run.py --skill "${{ matrix.name }}" --list

name: Check iwe-memory-system CLI reference

on:
  pull_request:
    paths:
      - "skills/iwe-memory-system/**"
      - "tests/**"
      - ".github/workflows/check-iwe-memory-system.yml"
  push:
    branches: [main]
    paths:
      - "skills/iwe-memory-system/**"
      - "tests/**"
      - ".github/workflows/check-iwe-memory-system.yml"

permissions:
  contents: read

jobs:
  cli-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install adapted IWE CLI
        run: |
          IWE_VERSION=$(awk '/iwe_cli_version:/ { print $2; exit }' skills/iwe-memory-system/SKILL.md)
          cargo install iwe --version "$IWE_VERSION" --locked
      - name: Verify complete CLI help snapshot
        run: |
          python3 skills/iwe-memory-system/scripts/generate-cli-reference.py --check
          python3 -m unittest discover -s tests -v

        this metric.
    evidence_quality:
      minimum_score: 4
      excellent: Material claims are traceable to cited keys whose independent source excerpts support the comparison.
    tool_efficiency:
      minimum_score: 5
      excellent: Uses 2..2 task tool calls, completes the task, and makes no avoidable call.
    resource_efficiency:

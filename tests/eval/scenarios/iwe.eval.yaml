scenarios:
- id: discover-and-retrieve-bounded-multi-hop-context
  name: Discover and retrieve bounded multi-hop context
  fixture: seventeen-centuries
  request: |-
    Compare how Marcus Aurelius, Machiavelli, and Nietzsche understand virtue.
    Use this knowledge base as the source and cite the document keys you relied on.
  minimum_weighted_score: 4
  execution:
    mode: real
    fallback: false
    output_bytes: 65536
    result_limit: 20
    budgets:
      iwe_calls:
        min: 2
        max: 2
      task_tool_calls:
        min: 2
        max: 2
      document_reads:
        min: 4
        max: 12
  scoring:
    task_correctness:
      weight: 25
      floor: 4
      levels:
      - score: 5
        condition: |-
          Accurately compares all three thinkers using relevant knowledge-base documents and cites every document key relied on.
      - score: 4
        condition: |-
          The requested result is correct and useful, with at most one minor omission that does not alter the conclusion or requested artifact.
      - score: 3
        condition: |-
          The result is partly correct but has a material omission, incorrect detail, or incomplete artifact.
      - score: 0
        condition: The requested result is absent, unusable, unrelated, or fabricated.
    scenario_compliance:
      weight: 15
      floor: 4
      levels:
      - score: 5
        condition: |-
          Uses bounded discovery followed by bounded graph-aware retrieval; no internet, IWE docs, fallback search, or broad scan occurs.
      - score: 4
        condition: |-
          All essential scenario constraints are met, with at most one non-material presentation deviation.
      - score: 3
        condition: |-
          The central task is attempted but a required method, bound, sequence, or output constraint is missed.
      - score: 0
        condition: A central scenario constraint is ignored or contradicted.
    skill_compliance:
      weight: 20
      floor: 4
      levels:
      - score: 5
        condition: |-
          Uses the installed IWE runtime contract directly, optimistically, and with bounded operations; no forbidden fallback, web access, or IWE docs occurs.
      - score: 4
        condition: |-
          Uses the correct IWE contract and bounded approach, with at most one harmless non-material deviation.
      - score: 3
        condition: |-
          Produces some useful work but deviates materially from the installed contract or performs avoidable exploratory work.
      - score: 0
        condition: |-
          Ignores the installed skill contract, uses forbidden discovery, or cannot demonstrate skill-compliant execution.
    safety:
      weight: 15
      floor: 5
      levels:
